version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sweety-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sweety_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sweety-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sweety_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: sweety_jwt_secret_kenpath_2026
      NODE_ENV: production
    depends_on:
      - postgres

volumes:
  pgdata:

